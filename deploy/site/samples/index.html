<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试图片 · 复拍对齐相机</title>
<link rel="stylesheet" href="/style.css">
<style>
.toc { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.toc a { font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; background: var(--card); color: var(--text); }
.group { scroll-margin-top: 10px; }
.cases { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.case { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.case .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.case .imgs.one { grid-template-columns: 1fr; }
.case .imgs a { position: relative; display: block; background: var(--soft); aspect-ratio: 4 / 3; overflow: hidden; }
.case .imgs img { width: 100%; height: 100%; object-fit: cover; }
.case .imgs span { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; border-radius: 5px; padding: 0 6px; }
.case .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.case .body .ex { font-size: 13px; color: var(--muted); }
.case .body .extra { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.case .body .row { margin-top: auto; }
.case .body .btn { padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><i></i>复拍对齐相机</a>
  <nav><a href="/">首页</a><a class="on" href="/samples/">测试图片</a><a href="/process/">在线处理</a><a href="/targets/">靶标</a><a href="/viewer/">导出包查看器</a><a href="/download/">下载</a></nav>
</div></header>
<main>
  <h1>测试图片</h1>
  <p class="muted">算法测试用的样例照片，全部由程序合成（真实混凝土纹理 + 模拟病害、光照、透视、镜头畸变），每组都有真值。
    点「在线处理」用服务器跑一遍，或把两张图下载到手机上测试。</p>
  <div class="card small">
    <b>测试链接</b>：
    <a href="/viewer/?zip=/samples/export_demo/全部测点_demo.zip">示例导出包（查看器）</a> ·
    <a href="/samples/export_demo/全部测点_demo.zip">下载示例导出包 ZIP</a> ·
    <a href="/targets/">批量生成靶标</a>
    <p class="muted" style="margin:6px 0 0">用手机翻拍测试：每组样例有自己的二维码编号（如 DEMO-H01），先拍「参考」建档，再拍「本次」复拍，App 会按编号自动配对。
      屏幕翻拍有摩尔纹、反光，结果会比直接分析原图差一些。</p>
  </div>
  <div class="toc" id="toc"></div>
  <div id="groups"><p class="muted">加载中…</p></div>
</main>
<footer>复拍对齐相机 · 测试图片（合成数据）</footer>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = p => p.split("/").map(encodeURIComponent).join("/");
fetch("/samples/manifest.json").then(r => r.json()).then(m => {
  document.getElementById("toc").innerHTML = m.groups.map(g => `<a href="#${g.id}">${esc(g.title)}（${g.cases.length}）</a>`).join("");
  document.getElementById("groups").innerHTML = m.groups.map(g => `<section class="group" id="${g.id}">
    <h2>${esc(g.title)}</h2><p class="muted small">${esc(g.desc)}</p>
    <div class="cases">${g.cases.map(c => {
      const pics = [c.ref && ["参考", c.ref], c.new && ["本次", c.new]].filter(Boolean);
      const proc = c.ref && c.new ? `/process/?ref=${encodeURIComponent(c.ref)}&new=${encodeURIComponent(c.new)}&title=${encodeURIComponent(g.title + " · " + c.title)}` : "";
      return `<div class="card case">
        <div class="imgs ${pics.length < 2 ? "one" : ""}">${pics.map(([l, p]) => `<a href="/${enc(p)}" target="_blank"><img loading="lazy" src="/${enc(p)}" alt="${l}"><span>${l}</span></a>`).join("")}</div>
        <div class="body"><div class="row" style="justify-content:space-between"><b>${esc(c.title)}</b>${c.code ? `<span class="tag">${esc(c.code)}</span>` : ""}</div><div class="ex">${esc(c.expect || "")}</div>
          ${c.extra && c.extra.length ? `<div class="extra"><span class="muted">算法输出：</span>${c.extra.map(([l, p]) => `<a href="/${enc(p)}" target="_blank">${esc(l)}</a>`).join("")}</div>` : ""}
          <div class="row">${proc ? `<a class="btn pri" href="${proc}">在线处理</a>` : ""}${pics.map(([l, p]) => `<a class="btn" href="/${enc(p)}" download>下载${l}</a>`).join("")}</div></div></div>`;
    }).join("")}</div></section>`).join("");
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}).catch(e => { document.getElementById("groups").innerHTML = `<p class="muted">清单加载失败：${esc(e.message)}</p>`; });
</script>
</body>
</html>
